<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMC Analyzer</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#10151c;--panel:#161d27;--line:#243040;--text:#d9e1ec;--dim:#7f8da1;--buy:#2ebd85;--sell:#f6465d;--ob:#4c8dff;--sweep:#b57bff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  #price{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  #status{margin-left:auto;color:var(--dim);font-size:12px}
  #status.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);margin-right:6px}
  main{flex:1;display:flex;min-height:0}
  #chartWrap{position:relative;flex:1;min-width:0}
  #chart,#overlay{position:absolute;inset:0}
  #overlay{pointer-events:none}
  aside{width:280px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  aside h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
  #legend{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;display:grid;gap:4px}
  #legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
  #signals{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
  #signals li{padding:10px 14px;border-bottom:1px solid var(--line)}
  #signals b.BUY{color:var(--buy)} #signals b.SELL{color:var(--sell)}
  #signals small{display:block;color:var(--dim);font-variant-numeric:tabular-nums}
  #empty{padding:14px;color:var(--dim)}
  #toasts{position:fixed;top:64px;right:16px;display:grid;gap:8px;z-index:10}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--buy);padding:10px 14px;min-width:230px;box-shadow:0 6px 20px #0008;animation:in .2s ease-out}
  .toast.SELL{border-left-color:var(--sell)}
  .toast b{display:block;font-size:15px}
  @keyframes in{from{transform:translateX(24px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.toast{animation:none}}
  @media (max-width:760px){main{flex-direction:column}aside{width:100%;height:34%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1 id="symbol">SMC Analyzer</h1>
  <span id="price">–</span>
  <span id="status">कनेक्ट हो रहा है…</span>
</header>
<main>
  <div id="chartWrap"><div id="chart"></div><canvas id="overlay"></canvas></div>
  <aside>
    <div id="legend">
      <span><i style="background:#2ebd85"></i>FVG (हरा = bullish, लाल = bearish)</span>
      <span><i style="background:#4c8dff"></i>Order Block</span>
      <span><i style="background:#b57bff"></i>Liquidity sweep</span>
    </div>
    <h2>Signals</h2>
    <ul id="signals"></ul>
    <div id="empty">अभी कोई signal नहीं। प्राइस किसी FVG या Order Block को टच करेगा तो यहाँ दिखेगा।</div>
  </aside>
</main>
<div id="toasts" aria-live="polite"></div>

<script>
const wrap = document.getElementById('chartWrap');
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{background:{color:'#10151c'},textColor:'#7f8da1'},
  grid:{vertLines:{color:'#1a2330'},horzLines:{color:'#1a2330'}},
  rightPriceScale:{borderColor:'#243040'},
  timeScale:{borderColor:'#243040',timeVisible:true,secondsVisible:false},
  crosshair:{mode:0},
  autoSize:true,
});
const series = chart.addCandlestickSeries({
  upColor:'#2ebd85',downColor:'#f6465d',borderVisible:false,
  wickUpColor:'#2ebd85',wickDownColor:'#f6465d',
});

const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
let analysis = {fvgs:[],order_blocks:[],sweeps:[],signals:[]};
let seen = new Set(), ready = false, lastTime = 0;

/* ---------- overlay: boxes drawn on a canvas above the chart ---------- */
const COLORS = {
  FVG_bull:['rgba(46,189,133,.16)','#2ebd85'], FVG_bear:['rgba(246,70,93,.16)','#f6465d'],
  OB_bull:['rgba(76,141,255,.22)','#4c8dff'],  OB_bear:['rgba(255,152,0,.22)','#ff9800'],
  SWEEP:['rgba(181,123,255,.20)','#b57bff'],
};
function drawBox(z, key, label){
  const ts = chart.timeScale();
  let x1 = ts.timeToCoordinate(z.start_time);
  let x2 = z.end_time ? ts.timeToCoordinate(z.end_time) : null;
  if (x1 === null) x1 = 0;
  const right = canvas.clientWidth - chart.priceScale('right').width();
  if (x2 === null) x2 = right;
  const y1 = series.priceToCoordinate(z.top), y2 = series.priceToCoordinate(z.bottom);
  if (y1 === null || y2 === null || x2 < 0 || x1 > right) return;
  const [fill, line] = COLORS[key];
  const h = Math.max(Math.abs(y2 - y1), 2);
  ctx.fillStyle = fill; ctx.fillRect(x1, Math.min(y1, y2), x2 - x1, h);
  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.strokeRect(x1 + .5, Math.min(y1, y2) + .5, x2 - x1, h);
  ctx.fillStyle = line; ctx.font = '11px system-ui'; ctx.fillText(label, Math.max(x1, 0) + 4, Math.min(y1, y2) + 12);
}
function render(){
  const dpr = devicePixelRatio || 1, w = wrap.clientWidth, h = wrap.clientHeight;
  if (canvas.width !== w*dpr || canvas.height !== h*dpr){ canvas.width = w*dpr; canvas.height = h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  analysis.fvgs.forEach(z => drawBox(z, 'FVG_'+z.side, 'FVG'));
  analysis.order_blocks.forEach(z => drawBox(z, 'OB_'+z.side, 'OB'));
  analysis.sweeps.forEach(z => drawBox(z, 'SWEEP', z.label));
  requestAnimationFrame(render);   // redraw every frame -> follows zoom/scroll/price-scale
}
requestAnimationFrame(render);

/* ---------- signals: arrows + list + alert pop-ups ---------- */
function applyAnalysis(a){
  analysis = a;
  series.setMarkers(a.signals.map(s => ({
    time:s.time, position:s.side==='BUY'?'belowBar':'aboveBar',
    color:s.side==='BUY'?'#2ebd85':'#f6465d',
    shape:s.side==='BUY'?'arrowUp':'arrowDown', text:`${s.side} ${s.strength}`,
  })));
  const list = document.getElementById('signals');
  list.innerHTML = '';
  [...a.signals].reverse().forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<b class="${s.side}">${s.side}</b> ${s.zone} · ${s.strength}
      <small>Entry ${s.price} · SL ${s.sl} · TP ${s.tp}</small>
      <small>${new Date(s.time*1000).toISOString().slice(11,16)} (chart time)</small>`;
    list.appendChild(li);
  });
  document.getElementById('empty').style.display = a.signals.length ? 'none' : 'block';
  a.signals.forEach(s => {
    if (!seen.has(s.id)){ seen.add(s.id); if (ready) alertSignal(s); }
  });
  ready = true;
}
function alertSignal(s){
  const t = document.createElement('div');
  t.className = 'toast ' + s.side;
  t.innerHTML = `<b>${s.side} signal (${s.strength})</b>${s.zone} zone पर प्राइस आया<br>Entry ${s.price} · SL ${s.sl} · TP ${s.tp}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 8000);
  try{ const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = s.side==='BUY'?880:440;
       o.connect(a.destination); o.start(); o.stop(a.currentTime + .15); }catch(e){}
}

/* ---------- WebSocket ---------- */
function connect(){
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  const st = document.getElementById('status');
  ws.onopen = () => { st.textContent = 'लाइव'; st.className = 'on'; };
  ws.onclose = () => { st.textContent = 'डिस्कनेक्ट — दोबारा कोशिश…'; st.className = ''; ready = false; setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'snapshot'){
      document.getElementById('symbol').textContent = m.symbol;
      series.setData(m.candles);
      chart.timeScale().fitContent();
    } else {
      series.update(m.candle);
    }
    const c = m.candle || m.candles[m.candles.length-1];
    document.getElementById('price').textContent = c.close.toFixed(2);
    applyAnalysis(m.analysis);
  };
}
connect();
</script>
</body>
</html>
